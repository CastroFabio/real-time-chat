name: CI - Real-Time Chat

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

jobs:
  build-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Testar Build do Frontend
        run: npm run build

  build-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      # Descomente abaixo se for usar Prisma no backend
      # - name: Gerar Prisma Client
      #   run: npx prisma generate

      - name: Executar Linter
        run: npm run lint

      # Descomente se houver testes configurados
      # - name: Executar Testes
      #   run: npm test

      - name: Testar Build do Backend
        run: npm run build
